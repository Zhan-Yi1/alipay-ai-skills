<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">支付宝小程序 Skills 生成效果对比</title>
  <desc id="desc">本工具在 Query通过率、用户动线完成度、源码忠实度、安全与权限边界和组件交互质量五项指标上均高于友商工具。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #17233d; font-size: 28px; font-weight: 600; }
      .subtitle { fill: #5b6880; font-size: 15px; }
      .legend { fill: #47546b; font-size: 14px; }
      .axis { fill: #738096; font-size: 12px; }
      .axis-title { fill: #5b6880; font-size: 13px; }
      .metric { fill: #17233d; font-size: 14px; font-weight: 600; }
      .value { fill: #17233d; font-size: 13px; font-weight: 600; }
      .delta { fill: #07875d; font-size: 12px; font-weight: 600; }
    </style>
    <linearGradient id="ourBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#00a6a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="58" class="title">评测结果对比</text>
  <text x="70" y="87" class="subtitle">同一评测集与评分口径 · 统一按百分制展示</text>

  <rect x="820" y="47" width="18" height="12" rx="2" fill="#aeb8c8"/>
  <text x="847" y="58" class="legend">友商工具</text>
  <rect x="950" y="47" width="18" height="12" rx="2" fill="url(#ourBar)"/>
  <text x="977" y="58" class="legend">本工具</text>

  <text x="70" y="126" class="axis-title">百分制得分 / 通过率（%）</text>
  <line x1="100" y1="150" x2="1130" y2="150" stroke="#edf0f5"/>
  <line x1="100" y1="250" x2="1130" y2="250" stroke="#edf0f5"/>
  <line x1="100" y1="350" x2="1130" y2="350" stroke="#edf0f5"/>
  <line x1="100" y1="450" x2="1130" y2="450" stroke="#edf0f5"/>
  <line x1="100" y1="550" x2="1130" y2="550" stroke="#cfd6e2"/>
  <line x1="100" y1="150" x2="100" y2="550" stroke="#cfd6e2"/>
  <text x="86" y="154" text-anchor="end" class="axis">100</text>
  <text x="86" y="254" text-anchor="end" class="axis">75</text>
  <text x="86" y="354" text-anchor="end" class="axis">50</text>
  <text x="86" y="454" text-anchor="end" class="axis">25</text>
  <text x="86" y="554" text-anchor="end" class="axis">0</text>

  <!-- 通过率: 86.2 / 98.8 -->
  <rect x="154" y="205.2" width="58" height="344.8" rx="3" fill="#aeb8c8"/>
  <text x="183" y="194" text-anchor="middle" class="value">86.2%</text>
  <rect x="224" y="154.8" width="58" height="395.2" rx="3" fill="url(#ourBar)"/>
  <text x="253" y="144" text-anchor="middle" class="value">98.8%</text>
  <text x="218" y="574" text-anchor="middle" class="metric">Query通过率</text>
  <text x="218" y="596" text-anchor="middle" class="delta">+12.6 个百分点</text>

  <!-- 用户动线完成度: 63.48 / 82.85 -->
  <rect x="360" y="296.08" width="58" height="253.92" rx="3" fill="#aeb8c8"/>
  <text x="389" y="285" text-anchor="middle" class="value">63.48</text>
  <rect x="430" y="218.6" width="58" height="331.4" rx="3" fill="url(#ourBar)"/>
  <text x="459" y="207" text-anchor="middle" class="value">82.85</text>
  <text x="424" y="574" text-anchor="middle" class="metric">用户动线</text>
  <text x="424" y="593" text-anchor="middle" class="metric">完成度</text>
  <text x="424" y="615" text-anchor="middle" class="delta">+19.37 分</text>

  <!-- 源码忠实度: 80 / 90 -->
  <rect x="566" y="230" width="58" height="320" rx="3" fill="#aeb8c8"/>
  <text x="595" y="219" text-anchor="middle" class="value">80</text>
  <rect x="636" y="190" width="58" height="360" rx="3" fill="url(#ourBar)"/>
  <text x="665" y="179" text-anchor="middle" class="value">90</text>
  <text x="630" y="574" text-anchor="middle" class="metric">源码忠实度</text>
  <text x="630" y="596" text-anchor="middle" class="delta">+10 分</text>

  <!-- 安全与权限边界: 90 / 92.5 -->
  <rect x="772" y="190" width="58" height="360" rx="3" fill="#aeb8c8"/>
  <text x="801" y="179" text-anchor="middle" class="value">90</text>
  <rect x="842" y="180" width="58" height="370" rx="3" fill="url(#ourBar)"/>
  <text x="871" y="169" text-anchor="middle" class="value">92.5</text>
  <text x="836" y="574" text-anchor="middle" class="metric">安全与权限</text>
  <text x="836" y="593" text-anchor="middle" class="metric">边界</text>
  <text x="836" y="615" text-anchor="middle" class="delta">+2.5 分</text>

  <!-- 组件交互质量: 65 / 85 -->
  <rect x="978" y="290" width="58" height="260" rx="3" fill="#aeb8c8"/>
  <text x="1007" y="279" text-anchor="middle" class="value">65</text>
  <rect x="1048" y="210" width="58" height="340" rx="3" fill="url(#ourBar)"/>
  <text x="1077" y="199" text-anchor="middle" class="value">85</text>
  <text x="1042" y="574" text-anchor="middle" class="metric">组件交互质量</text>
  <text x="1042" y="596" text-anchor="middle" class="delta">+20 分</text>

  <line x1="70" y1="646" x2="1130" y2="646" stroke="#dfe4ec"/>
  <text x="70" y="675" class="subtitle">通过率由 0–1 换算为百分比；其余指标为百分制得分。柱下方为绝对提升。</text>
</svg>
